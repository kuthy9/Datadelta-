[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# The import package and the command are both `datadelta`; the PyPI names
# `datadelta` and `datadiff` are taken, so the distribution is `datadelta-cli`.
name = "datadelta-cli"
dynamic = ["version"]
description = "data ▲ — what changed in your data, and why it matters."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    # CLI framework - turns type annotations into flags and --help text
    "typer>=0.12",
    # Rich terminal output - colors, tables, live progress
    "rich>=13",
    # Core data processing
    "pandas>=2.0",
    # Imported directly by the diff and metrics engines
    "numpy>=1.24",
    # DuckDB: embedded SQL engine, reads CSV/JSON/Parquet directly without import
    "duckdb>=0.10",
    # Statistical tests: KS test, chi-square
    "scipy>=1.12",
    # Default LLM provider for --story and `datadelta init`
    "anthropic>=0.25",
    # HTML report templating
    "jinja2>=3.1",
    # Excel support (.xlsx)
    "openpyxl>=3.1",
    # metrics.yaml parsing
    "pyyaml>=6.0",
    # SQL database connections (PostgreSQL, MySQL, SQL Server, SQLite)
    "sqlalchemy>=2.0",
]

# Optional extras: install only what you need
#   pip install "datadelta-cli[postgres]"
#   pip install "datadelta-cli[all]"      (everything except mssql)
# mssql is not part of `all` because pyodbc needs a system ODBC driver.
[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]            # PostgreSQL driver
mysql    = ["pymysql>=1.1"]                    # MySQL driver
mssql    = ["pyodbc>=5.0"]                     # SQL Server driver (needs OS ODBC driver)
watch    = ["watchdog>=4.0"]                   # File watching for --watch mode
openai   = ["openai>=1.0"]                     # --llm openai / --llm deepseek
gemini   = ["google-generativeai>=0.5"]        # --llm gemini
dev      = ["pytest>=8"]                       # test suite
all      = [
    "psycopg2-binary>=2.9",
    "pymysql>=1.1",
    "watchdog>=4.0",
    "openai>=1.0",
    "google-generativeai>=0.5",
]

# `pip install` creates the `datadelta` command in the user's shell
[project.scripts]
datadelta = "datadelta.cli:app"

# Single version source: src/datadelta/__init__.py
[tool.hatch.version]
path = "src/datadelta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/datadelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from the checkout, not from the editable-install .pth: on macOS that
# file can get the UF_HIDDEN flag, and CPython then skips it.
pythonpath = ["src"]
markers = [
    "slow: long-running smoke tests",
    "build: builds the wheel with uv",
]
